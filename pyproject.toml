[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-cost-sensitive-xgboost"
version = "0.1.0"
description = "Cost-sensitive XGBoost versus the FD01 logistic baseline for card fraud detection (FD02)"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "jupytext==1.19.6",
    "nbconvert==7.17.2",
    "ipykernel==7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
